name: Install dependencies
description: Setup Yarn and Node.js and installs dependencies for the workflow
runs:
  using: composite
  steps:
    # This action assumes the repository has already been checked out
    - name: Setup Yarn
      shell: bash
      run: |
        corepack enable yarn
    - name: Setup Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: "24"
        cache: 'yarn'
    - name: Install dependencies
      shell: bash
      run: yarn install --immutable
