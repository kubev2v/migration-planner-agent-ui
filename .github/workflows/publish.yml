name: Publish OCI image to Quay.io

on:
  push:
    branches:
      - main
      - stable
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/install-dependencies
      - name: Build all workspaces
        run: yarn build:all

      - name: Generate Dockerfile
        run: |
          cat > Dockerfile.scratch <<'EOF'
          FROM scratch
          COPY . ./apps/agent-ui/dist
          EOF

      - name: Login to Quay.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: quay.io
          username: ${{ vars.QUAY_ROBOT_NAME }}
          password: ${{ secrets.QUAY_ROBOT_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ vars.QUAY_IMAGE_REPO }}
          tags: |
            # For push to main: tag as "latest"
            type=raw,value=latest,enable=${{ github.event_name == 'push' }}
            # For release: tag as "stable" + semver
            type=raw,value=stable,enable=${{ github.event_name == 'release' }}
            type=semver,pattern={{version}},enable=${{ github.event_name == 'release' }}
            # Always include short SHA
            type=sha,prefix=,format=short

      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ./apps/agent-ui/dist
          file: Dockerfile.scratch
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
