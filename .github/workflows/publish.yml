name: Publish OCI image to Quay.io

on:
  push:
    branches:
      - main
      - stable
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: ./.github/actions/install-dependencies
      - name: Build all workspaces
        run: yarn build:all

      - name: Generate Dockerfile
        run: |
          cat > Dockerfile.scratch <<'EOF'
          FROM scratch
          COPY . ./apps/agent-ui/dist
          EOF

      - name: Login to Quay.io
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: quay.io
          username: ${{ vars.QUAY_ROBOT_NAME }}
          password: ${{ secrets.QUAY_ROBOT_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ${{ vars.QUAY_IMAGE_REPO }}
          tags: |
            # For push to main: tag as "latest"
            type=raw,value=latest,enable=${{ github.event_name == 'push' }}
            # For release: tag as "stable" + semver
            type=raw,value=stable,enable=${{ github.event_name == 'release' }}
            type=semver,pattern={{version}},enable=${{ github.event_name == 'release' }}
            # Always include short SHA
            type=sha,prefix=,format=short

      - name: Build and push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: ./apps/agent-ui/dist
          file: Dockerfile.scratch
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
