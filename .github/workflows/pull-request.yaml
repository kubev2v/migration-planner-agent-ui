name: PR Validations
on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - edited
      - ready_for_review
    branches:
      - main
      - stable

permissions:
  pull-requests: read
  contents: read

jobs:
  # Configuration job - define all shared values once
  config:
    runs-on: ubuntu-latest
    outputs:
      allowed-types: ${{ steps.set-config.outputs.allowed-types }}
      jira-pattern: ${{ steps.set-config.outputs.jira-pattern }}
      jira-required-types: ${{ steps.set-config.outputs.jira-required-types }}
      bot-authors: ${{ steps.set-config.outputs.bot-authors }}
      run-code-validations: ${{ steps.filter.outputs.code }}
    steps:
      - id: set-config
        run: |
          echo 'allowed-types=["feat","fix","ci","build","chore","docs","refactor","test","style","perf","revert"]' >> $GITHUB_OUTPUT
          echo 'jira-pattern=(ECOPROJECT|OMA)-[0-9]+' >> $GITHUB_OUTPUT
          echo 'jira-required-types=["feat","fix"]' >> $GITHUB_OUTPUT
          echo 'bot-authors=["red-hat-konflux[bot]","dependabot[bot]","renovate[bot]"]' >> $GITHUB_OUTPUT

      - name: Check out path filters
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Detect whether code validations are needed
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: .github/path-filters.yml
          predicate-quantifier: 'every'

  # Validate commit messages
  validate-commits:
    needs: config
    uses: kubev2v/migration-planner-workflows/.github/workflows/validate-commit-messages.yml@b5de744cc45e4daaf9e28dcd6b179ab4a8ad7c7c # main
    with:
      types: ${{ needs.config.outputs.allowed-types }}
      jira-pattern: ${{ needs.config.outputs.jira-pattern }}
      jira-required-types: ${{ needs.config.outputs.jira-required-types }}
      skip-authors: ${{ needs.config.outputs.bot-authors }}

  # Validate PR title and description
  validate-pr-title:
    needs: config
    uses: kubev2v/migration-planner-workflows/.github/workflows/validate-pr-title-description.yml@b5de744cc45e4daaf9e28dcd6b179ab4a8ad7c7c # main
    with:
      allowed-types: ${{ needs.config.outputs.allowed-types }}
      jira-pattern: ${{ needs.config.outputs.jira-pattern }}
      jira-required-types: ${{ needs.config.outputs.jira-required-types }}
      skip-authors: ${{ needs.config.outputs.bot-authors }}

  lint-and-format:
    needs: [config, validate-commits, validate-pr-title]
    if: needs.config.outputs.run-code-validations == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/install-dependencies
      - run: yarn check:all
  type-check:
    needs: [config, validate-commits, validate-pr-title]
    if: needs.config.outputs.run-code-validations == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/install-dependencies
      - run: yarn typecheck:all
  test:
    needs: [config, validate-commits, validate-pr-title]
    if: needs.config.outputs.run-code-validations == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/install-dependencies
      - run: yarn test:all
  build:
    needs: [config, validate-commits, validate-pr-title]
    if: needs.config.outputs.run-code-validations == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/install-dependencies
      - run: yarn build:all

  # Always runs so branch protection can require this single check.
  # Skipped jobs count as success, but a failed commit check would also skip
  # them — this job fails unless commit/title checks passed and, when code
  # changed, the code validations passed.
  required:
    name: Required validations
    needs:
      - config
      - validate-commits
      - validate-pr-title
      - lint-and-format
      - type-check
      - test
      - build
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify required jobs
        env:
          RUN_CODE: ${{ needs.config.outputs.run-code-validations }}
          CONFIG: ${{ needs.config.result }}
          COMMITS: ${{ needs.validate-commits.result }}
          TITLE: ${{ needs.validate-pr-title.result }}
          LINT: ${{ needs.lint-and-format.result }}
          TYPECHECK: ${{ needs.type-check.result }}
          TEST: ${{ needs.test.result }}
          BUILD: ${{ needs.build.result }}
        run: |
          echo "config=$CONFIG commits=$COMMITS title=$TITLE run_code=$RUN_CODE"
          echo "lint=$LINT typecheck=$TYPECHECK test=$TEST build=$BUILD"

          fail() { echo "::error::$1"; exit 1; }

          [[ "$CONFIG" == success ]] || fail "config did not succeed ($CONFIG)"
          [[ "$COMMITS" == success ]] || fail "validate-commits did not succeed ($COMMITS)"
          [[ "$TITLE" == success ]] || fail "validate-pr-title did not succeed ($TITLE)"

          if [[ "$RUN_CODE" == true ]]; then
            [[ "$LINT" == success ]] || fail "lint-and-format did not succeed ($LINT)"
            [[ "$TYPECHECK" == success ]] || fail "type-check did not succeed ($TYPECHECK)"
            [[ "$TEST" == success ]] || fail "test did not succeed ($TEST)"
            [[ "$BUILD" == success ]] || fail "build did not succeed ($BUILD)"
          else
            echo "Only skippable files changed; code validations were skipped"
          fi
